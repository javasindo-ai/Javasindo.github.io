<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karier — JAVAS INDO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main class="container py-5">
    <h1>Karier</h1>
    <p>Lowongan tersedia. Unggah CV melalui formulir berikut.</p>
    <form class="mt-3">
      <div class="mb-3"><label>Nama</label><input class="form-control" required></div>
      <div class="mb-3"><label>Email</label><input type="email" class="form-control" required></div>
      <div class="mb-3"><label>Upload CV (PDF)</label><input type="file" class="form-control" accept=".pdf" required></div>
      <button class="btn btn-primary" type="submit">Kirim Lamaran</button>
    </form>
  </main>
</body>
</html>
