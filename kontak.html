<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontak — JAVAS INDO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <main class="container py-5">
    <h1>Hubungi Kami</h1>
    <p>Alamat kantor dan peta (embed Google Maps), jam operasional, dan form kontak.</p>
    <div class="row">
      <div class="col-md-6">
        <form id="contactForm">
          <div class="mb-3"><label>Nama</label><input class="form-control" required></div>
          <div class="mb-3"><label>Email</label><input type="email" class="form-control" required></div>
          <div class="mb-3"><label>Pesan</label><textarea class="form-control" rows="5" required></textarea></div>
          <button class="btn btn-success" type="submit">Kirim</button>
        </form>
      </div>
      <div class="col-md-6">
        <h6>Lokasi</h6>
        <div class="ratio ratio-16x9">
          <iframe src="https://www.google.com/maps/embed?pb=!1m18" style="border:0;" allowfullscreen loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </main>
  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e){
      e.preventDefault();
      alert('Terima kasih — formulir akan terintegrasi dengan backend nanti.');
      this.reset();
    });
  </script>
</body>
</html>
